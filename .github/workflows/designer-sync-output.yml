name: Sync Designer Assets to Output

# designer_develop の Assets/Designer 以下の実体ファイルだけを designer_output へミラーする。
# .meta は designer_output 側で一元管理する(Generate Designer Meta Files が生成)ため同期しない。
# 詳細: ClaudeUsers/meta自動生成フローガイド.md

on:
  push:
    branches: [designer_develop]
    paths:
      - 'Assets/Designer/**'
  workflow_dispatch:

permissions:
  contents: write

# designer_output へ push するワークフロー同士を直列化する
concurrency:
  group: designer-output
  cancel-in-progress: false

env:
  # LFS 実体はダウンロードせずポインタのまま同期する(実体はデザイナーの push で既にサーバーにある)
  GIT_LFS_SKIP_SMUDGE: 1

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout designer_output
        uses: actions/checkout@v4
        with:
          ref: designer_output

      - name: Checkout designer_develop
        uses: actions/checkout@v4
        with:
          ref: designer_develop
          path: .dev-src

      - name: Mirror Assets/Designer (実体ファイルのみ、.metaは触らない)
        run: |
          mkdir -p Assets/Designer
          rsync -a --delete --exclude '*.meta' \
            .dev-src/Assets/Designer/ Assets/Designer/
          rm -rf .dev-src

      - name: Remove orphaned .meta（実体が削除された場合の掃除）
        run: |
          find Assets/Designer -name '*.meta' -print0 | while IFS= read -r -d '' meta; do
            src="${meta%.meta}"
            [ -e "$src" ] || rm -- "$meta"
          done

      - name: Commit & push if changed
        run: |
          git config user.name "sync-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A Assets/Designer
          if ! git diff --cached --quiet; then
            git commit -m "chore: sync Assets/Designer from designer_develop"
            git push origin HEAD:designer_output
          else
            echo "No changes"
          fi
