# Confluenceの「仕様書」フォルダ配下のページが更新されたとき、
# 更新時に入力された「変更の概要」(公開ダイアログの任意入力欄)をDiscordに通知し、
# 併せて「変更履歴」ページの表に1行自動追記する。
#
# トリガー: repository_dispatch (type: confluence-page-content-updated)
#   Confluence Automationの「ページを編集した」ルールから、対象ページIDを添えて呼び出される。
#   POST https://api.github.com/repos/<owner>/<repo>/dispatches
#   body: {"event_type": "confluence-page-content-updated", "client_payload": {"pageId": "<ページID>"}}
#
#   対象フォルダ配下かどうかの判定・変更履歴ページ自身の除外は、スクリプト側で
#   ページIDから直接取得したancestorsで行う(検索インデックス経由のCQL条件は使わない)。
#   これによりAutomation側の遅延ステップはほぼ不要(数秒あれば十分)。
#
# 事前準備 (リポジトリの Settings > Secrets and variables > Actions で設定):
#   Secrets:   CONFLUENCE_EMAIL, CONFLUENCE_API_TOKEN (sync-spec-pages.ymlと共用),
#              DISCORD_WEBHOOK_PLANNER (discord-notify-push.ymlのleveldesign通知と共用)
#   Variables: CONFLUENCE_BASE_URL (sync-spec-pages.ymlと共用),
#              CONFLUENCE_FOLDER_ID (監視対象フォルダのID。sync-spec-pages.ymlと共用),
#              CONFLUENCE_CHANGELOG_PAGE_ID (変更履歴ページのID)

name: Notify Changelog Updates to Discord

on:
  repository_dispatch:
    types: [confluence-page-content-updated]

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Notify page update to Discord
        env:
          CONFLUENCE_BASE_URL: ${{ vars.CONFLUENCE_BASE_URL }}
          CONFLUENCE_EMAIL: ${{ secrets.CONFLUENCE_EMAIL }}
          CONFLUENCE_API_TOKEN: ${{ secrets.CONFLUENCE_API_TOKEN }}
          CONFLUENCE_PAGE_ID: ${{ github.event.client_payload.pageId }}
          CONFLUENCE_FOLDER_ID: ${{ vars.CONFLUENCE_FOLDER_ID }}
          CONFLUENCE_CHANGELOG_PAGE_ID: ${{ vars.CONFLUENCE_CHANGELOG_PAGE_ID }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_PLANNER }}
        run: node .github/scripts/notify-page-updated.js
