# push を検知して、ブランチに応じたDiscordチャンネルへ通知する。
#
# 振り分けルール:
#   develop への直push、または個人名ブランチ(吉田京志郎/** 等)からのpush → プログラマー進捗
#   leveldesign への push                                                → プランナー進捗
#   designer_develop への push(Artist/ の作業データ)                 → デザイナー進捗(📝 作業進捗)
#     (Artist/ を触ったコミットのみ。develop の取り込みは通知しない)
#   ※ Assets/Designer/ への完成データの push は designer_output 経由で
#     「✅ 作業完了」として designer-generate-meta.yml が送る
#
# 先頭コミットの親コミット数をGitHub APIで確認し、2つ以上ならマージコミット
# (PRマージ・git mergeいずれも含む)とみなして、直pushと区別できるように
# タイトル(🔀 マージされました / 📦 push)と色を出し分ける。
#
# 事前準備 (リポジトリの Settings > Secrets and variables > Actions で設定):
#   Secrets: DISCORD_WEBHOOK_PROGRAMMER, DISCORD_WEBHOOK_PLANNER, DISCORD_WEBHOOK_DESIGNER
#   (GH_TOKENは既定のsecrets.GITHUB_TOKENを使用。追加設定不要)

name: Discord Notify - Push

on:
  push:
    branches:
      - develop
      - leveldesign
      - designer_develop
      - "吉田京志郎/**"
      - "秋野翔太/**"
      - "宇留野陸斗/**"
      - "中出峻輔/**"
      - "元浪梨緒/**"
      - "吉本竜/**"
      - "中田颯吾/**"
      - "大平理月/**"
      - "岩間翔大/**"
      - "宮地瑛大/**"

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Determine target channel
        id: route
        run: |
          ref="${GITHUB_REF#refs/heads/}"
          if [ "$ref" = "leveldesign" ]; then
            echo "channel=PLANNER" >> "$GITHUB_OUTPUT"
          elif [ "$ref" = "designer_develop" ]; then
            echo "channel=DESIGNER" >> "$GITHUB_OUTPUT"
          else
            echo "channel=PROGRAMMER" >> "$GITHUB_OUTPUT"
          fi

      - name: Send Discord notification
        env:
          DISCORD_WEBHOOK_PROGRAMMER: ${{ secrets.DISCORD_WEBHOOK_PROGRAMMER }}
          DISCORD_WEBHOOK_PLANNER: ${{ secrets.DISCORD_WEBHOOK_PLANNER }}
          DISCORD_WEBHOOK_DESIGNER: ${{ secrets.DISCORD_WEBHOOK_DESIGNER }}
          CHANNEL: ${{ steps.route.outputs.channel }}
          REF_NAME: ${{ github.ref_name }}
          PUSHER: ${{ github.actor }}
          COMPARE_URL: ${{ github.event.compare }}
          REPO_URL: ${{ github.event.repository.html_url }}
          HEAD_SHA: ${{ github.sha }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          case "$CHANNEL" in
            PLANNER) url="$DISCORD_WEBHOOK_PLANNER" ;;
            DESIGNER) url="$DISCORD_WEBHOOK_DESIGNER" ;;
            *) url="$DISCORD_WEBHOOK_PROGRAMMER" ;;
          esac

          if [ -z "$url" ]; then
            echo "対応するWebhook Secretが未設定のためスキップします ($CHANNEL)" >&2
            exit 0
          fi

          # 今回のpushで追加されたコミット一覧を1行ずつのMarkdown箇条書きにする
          if [ "$REF_NAME" = "designer_develop" ]; then
            # develop の取り込み(マージ・プログラマー側のコミット)は流さず、作業データ(Artist/)を触ったコミットだけにする
            commits_json=$(jq -c '[.commits[] | select([.added[]?, .modified[]?, .removed[]?] | any(startswith("Artist/"))) | {message: (.message | split("\n")[0]), url: .url, author: .author.name}]' "$GITHUB_EVENT_PATH")
          else
            commits_json=$(jq -c '[.commits[] | {message: (.message | split("\n")[0]), url: .url, author: .author.name}]' "$GITHUB_EVENT_PATH")
          fi

          # 新規コミットが無い場合(既存コミットからのブランチ作成など)は通知しない
          if [ "$(echo "$commits_json" | jq 'length')" = "0" ]; then
            echo "新規コミットが無いためスキップします(ブランチ作成のみ等)" >&2
            exit 0
          fi

          description=$(echo "$commits_json" | jq -r '.[] | "- [\(.message)](\(.url)) (\(.author))"')

          # 先頭コミットの親が2つ以上ならマージコミット(PRマージ・git merge問わず)とみなし、
          # 直pushと見た目で区別できるようにタイトル・色を変える。
          parent_count=$(gh api "repos/${REPO_URL#https://github.com/}/commits/${HEAD_SHA}" --jq '.parents | length')
          if [ "$REF_NAME" = "designer_develop" ]; then
            # designer_output 側の「作業完了」通知は Generate Designer Meta Files が送る
            title="📝 作業進捗 (designer_develop)"
            color=16705372
          elif [ "$parent_count" -ge 2 ]; then
            title="🔀 ${REF_NAME} にマージされました"
            color=7288001
          else
            title="📦 ${REF_NAME} へpush"
            color=3447003
          fi

          payload=$(jq -n \
            --arg title "$title" \
            --arg desc "$description" \
            --arg url "$COMPARE_URL" \
            --arg author "$PUSHER" \
            --argjson color "$color" \
            '{
              embeds: [{
                title: $title,
                description: $desc,
                url: $url,
                color: $color,
                footer: { text: $author }
              }]
            }')

          curl -sf -X POST -H "Content-Type: application/json" -d "$payload" "$url"
