name: Sync Designer Assets to Output

# designer_develop の Assets/Designer 以下の実体ファイルのうち、push で追加・変更・削除されたものだけを designer_output へ反映する。
# (develop 側にだけあるファイルを消さないため、全体ミラー(rsync --delete)はしない)
# .meta は designer_output 側で一元管理する(Generate Designer Meta Files が生成)ため同期しない。
# 詳細: ClaudeUsers/meta自動生成フローガイド.md

on:
  push:
    branches: [designer_develop]
    paths:
      - 'Assets/Designer/**'
  workflow_dispatch:

permissions:
  contents: write

# designer_output へ push するワークフロー同士を直列化する
concurrency:
  group: designer-output
  cancel-in-progress: false

env:
  # LFS 実体はダウンロードせずポインタのまま同期する(実体はデザイナーの push で既にサーバーにある)
  GIT_LFS_SKIP_SMUDGE: 1

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout designer_output
        uses: actions/checkout@v4
        with:
          ref: designer_output

      - name: Checkout designer_develop
        uses: actions/checkout@v4
        with:
          ref: designer_develop
          path: .dev-src
          fetch-depth: 0  # push 前後の差分(before..after)を取るため

      - name: Apply Assets/Designer changes (実体ファイルのみ、.metaは触らない)
        env:
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
        run: |
          mkdir -p Assets/Designer
          if [ "$GITHUB_EVENT_NAME" = "push" ] && [ -n "$BEFORE" ] && [ "${BEFORE//0/}" != "" ] \
             && git -C .dev-src cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            # push の差分だけを反映する。designer_develop で消したファイルだけが消え、develop 側にだけあるファイルには触らない
            git -C .dev-src diff --name-status -z --no-renames "$BEFORE" "$AFTER" -- Assets/Designer \
            | while IFS= read -r -d '' status && IFS= read -r -d '' path; do
                case "$path" in *.meta) continue ;; esac
                case "$status" in
                  D) rm -f -- "$path" ;;
                  *) mkdir -p -- "$(dirname -- "$path")"; cp -p -- ".dev-src/$path" "$path" ;;
                esac
              done
          else
            # 手動実行など差分が取れない場合は、追加・更新だけを反映する(削除はしない)
            rsync -a --exclude '*.meta' .dev-src/Assets/Designer/ Assets/Designer/
          fi
          rm -rf .dev-src

      - name: Remove orphaned .meta（実体が削除された場合の掃除）
        run: |
          find Assets/Designer -name '*.meta' -print0 | while IFS= read -r -d '' meta; do
            src="${meta%.meta}"
            [ -e "$src" ] || rm -- "$meta"
          done

      - name: Commit & push if changed
        id: push
        run: |
          git config user.name "sync-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A Assets/Designer
          if ! git diff --cached --quiet; then
            git commit -m "chore: sync Assets/Designer from designer_develop"
            git push origin HEAD:designer_output
            echo "pushed=true" >> "$GITHUB_OUTPUT"
          else
            echo "No changes"
          fi

      # 「作業完了」通知(Generate Designer Meta Files)で designer_develop のコミット一覧を使うため受け渡す
      - name: Save designer_develop commits
        if: steps.push.outputs.pushed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # push イベントの commits[] には変更ファイル一覧(added/modified/removed)が入らないため、
          # コミットごとに API で変更ファイルを取得して Assets/Designer/ を触ったものだけ残す。
          # develop の取り込み(マージコミット)は除外する。
          commits_json='[]'
          while IFS= read -r c; do
            sha=$(echo "$c" | jq -r '.id')
            hit=$(gh api "repos/$GITHUB_REPOSITORY/commits/$sha" \
              --jq 'if (.parents | length) > 1 then false else ([.files[]?.filename] | any(startswith("Assets/Designer/"))) end')
            if [ "$hit" = "true" ]; then
              commits_json=$(echo "$commits_json" | jq -c --argjson c "$c" '. + [{message: ($c.message | split("\n")[0]), url: $c.url, author: $c.author.name}]')
            fi
          done < <(jq -c '.commits[]?' "$GITHUB_EVENT_PATH")
          echo "$commits_json" > designer-commits.json
          cat designer-commits.json

      - name: Upload designer_develop commits
        if: steps.push.outputs.pushed == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: designer-commits
          path: designer-commits.json
          retention-days: 1
